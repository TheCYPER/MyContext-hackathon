<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="MyContext keeps academic and professional context ready for your next conversation." />
    <title>MyContext · Academic &amp; professional context</title>
    <script>
      (() => {
        try {
          const saved = JSON.parse(localStorage.getItem("mycontext-theme") || "{}");
          const theme = saved?.state?.theme || "system";
          const dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch { /* local preference is optional */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
