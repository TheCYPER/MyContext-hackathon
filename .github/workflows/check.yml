name: Check MyContext
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check runtime versions
        run: |
          git --version
          ruby --version
          ruby -rjson -e 'puts "JSON #{JSON::VERSION}"'
          node --version
          node -e 'if (Number(process.versions.node.split(".")[0]) < 20) process.exit(1)'
      - name: Verify public source snapshot
        run: bash scripts/check.sh --ci
